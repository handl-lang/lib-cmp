[package]
name = "handl-lib-cmp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "cmp — comparison predicates (eq/lt/gt/clamp/min/max/compare)."
license = "MIT"
repository = "https://github.com/handl-lang/lib-cmp"
readme = "README.md"
homepage = "https://github.com/handl-lang/lib-cmp"

[dependencies]
handl-lib-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/kernel"]
handl-ops = { path = "../kernel/crates/handl-ops" }
handl-lib-ops = { path = "../kernel/crates/ops" }
